{%- assign services = site.data.services -%}
{%- if services -%}
<div class="mt-3 mb-0 bg-white shadow-sm rounded-xl">
    <h6 class="p-3 mb-0 border-bottom border-gray">
        <i class="fas fa-hand-holding-heart"></i><span style="margin-left: 0.3em;">Services</span>
    </h6>
    <div class="px-3 pt-3 pb-3">
        <ul class="service-list">
            {%- for entry in services.years -%}
            <li>
                <span class="service-year">{{ entry.year }}</span>{{ entry.venues }}
            </li>
            {%- endfor -%}

            {%- for entry in services.roles -%}
            <li>
                <span class="service-role">{{ entry.role }}</span>: {{ entry.venues }}
            </li>
            {%- endfor -%}
        </ul>
    </div>
</div>
{%- endif -%}
